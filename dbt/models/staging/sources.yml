version: 2

sources:
  - name: silver
    description: "Données détaillées Silver chargées dans PostgreSQL."
    schema: staging

    tables:
      - name: silver_employees
        description: "Employés validés issus de Silver."
        columns:
          - name: employee_id
            data_tests:
              - not_null
              - unique

      - name: silver_activities
        description: "Activités sportives validées issues de Silver."
        columns:
          - name: activity_id
            data_tests:
              - not_null
              - unique

          - name: employee_id
            data_tests:
              - not_null

          - name: activity_type
            data_tests:
              - not_null

          - name: started_at
            data_tests:
              - not_null