name: sportpulse-ai-step-aws

# Stack AWS autonome : ne démarre ni MinIO ni le conteneur bucket-init.
# Les buckets doivent exister dans le compte AWS avant le lancement.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.aws
    environment:
      APP_ENV: aws
      # Chaîne vide : boto3 utilise l'endpoint AWS S3 standard.
      S3_ENDPOINT_URL: ""
      SOURCE_DIR: /app/data/source
      MANIFEST_DIR: /app/data/manifests
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
